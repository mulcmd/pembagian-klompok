<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pembagi Kelompok</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: var(--primary);
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .panel {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }

    textarea, input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    textarea:focus, input[type="number"]:focus {
      border-color: var(--primary);
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      align-items: center;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #10b981;
      padding: 8px 14px;
      font-size: 14px;
      width: auto;
    }

    .btn-secondary:hover {
      background: #059669;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      font-size: 14px;
      width: auto;
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .export-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      justify-content: flex-end;
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .group-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .group-card h3 {
      font-size: 16px;
      color: var(--primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .member-list {
      list-style: none;
    }

    .member-item {
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .badge-leader {
      background: #fef3c7;
      color: #d97706;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .badge-gender {
      font-size: 12px;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pembagi Kelompok</h1>
    <p class="subtitle">Bagi anggota ke dalam kelompok dengan cepat dan acak</p>

    <div class="panel">
      <div class="grid-2">
        <div>
          <label for="males">Anggota Laki-Laki (pisahkan koma/baris baru)</label>
          <textarea id="males" placeholder="Budi, Agus, Andi, Eko..."></textarea>
        </div>
        <div>
          <label for="females">Anggota Perempuan (pisahkan koma/baris baru)</label>
          <textarea id="females" placeholder="Siti, Dewi, Rina, Maya..."></textarea>
        </div>
      </div>

      <div class="options">
        <div style="width: 150px;">
          <label for="groupCount">Jumlah Kelompok</label>
          <input type="number" id="groupCount" value="3" min="1">
        </div>
        <div style="margin-top: 20px; display: flex; gap: 16px;">
          <label class="checkbox-label">
            <input type="checkbox" id="balanceGender" checked> Seimbangkan Gender
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="assignLeader" checked> Tentukan Ketua
          </label>
        </div>
      </div>

      <button class="btn" onclick="generateGroups()">Acak Kelompok</button>
    </div>

    <div id="resultSection" style="display: none;">
      <div class="export-actions">
        <button class="btn btn-secondary" onclick="copyWA()">Salin untuk WhatsApp</button>
        <button class="btn btn-outline" onclick="copyExcel()">Salin untuk Excel</button>
      </div>

      <div id="groupsContainer" class="groups-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast">Berhasil disalin!</div>

  <script>
    let currentGroups = [];

    function parseInput(text) {
      return text
        .split(/[\n,]+/)
        .map(name => name.trim())
        .filter(name => name.length > 0);
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateGroups() {
      const maleNames = parseInput(document.getElementById('males').value);
      const femaleNames = parseInput(document.getElementById('females').value);
      const groupCount = parseInt(document.getElementById('groupCount').value) || 1;
      const balanceGender = document.getElementById('balanceGender').checked;
      const assignLeader = document.getElementById('assignLeader').checked;

      const males = shuffle(maleNames.map(name => ({ name, gender: 'L' })));
      const females = shuffle(femaleNames.map(name => ({ name, gender: 'P' })));

      if (males.length === 0 && females.length === 0) {
        alert('Masukkan minimal satu nama anggota!');
        return;
      }

      // Inisialisasi kelompok
      const groups = Array.from({ length: groupCount }, () => []);

      if (balanceGender) {
        // Bagi Laki-laki secara merata
        males.forEach((member, index) => {
          groups[index % groupCount].push(member);
        });
        // Bagi Perempuan secara merata
        females.forEach((member, index) => {
          groups[index % groupCount].push(member);
        });
      } else {
        // Gabung semua lalu acak
        const allMembers = shuffle([...males, ...females]);
        allMembers.forEach((member, index) => {
          groups[index % groupCount].push(member);
        });
      }

      // Penentuan Ketua
      currentGroups = groups.map(group => {
        const shuffledGroup = shuffle(group);
        return shuffledGroup.map((member, idx) => ({
          ...member,
          isLeader: assignLeader && idx === 0
        }));
      });

      renderGroups();
    }

    function renderGroups() {
      const container = document.getElementById('groupsContainer');
      container.innerHTML = '';

      currentGroups.forEach((group, index) => {
        const card = document.createElement('div');
        card.className = 'group-card';
        
        let html = `<h3>Kelompok ${index + 1} (${group.length} Orang)</h3><ul class="member-list">`;
        
        group.forEach(member => {
          html += `
            <li class="member-item">
              <span>
                ${member.name} 
                <span class="badge-gender">(${member.gender})</span>
              </span>
              ${member.isLeader ? '<span class="badge-leader">KETUA</span>' : ''}
            </li>
          `;
        });
        
        html += '</ul>';
        card.innerHTML = html;
        container.appendChild(card);
      });

      document.getElementById('resultSection').style.display = 'block';
    }

    function copyWA() {
      let text = '*HASIL PEMBAGIAN KELOMPOK*\n\n';
      currentGroups.forEach((group, index) => {
        text += `*Kelompok ${index + 1}*\n`;
        group.forEach(member => {
          const leaderTag = member.isLeader ? ' *(Ketua)*' : '';
          text += `• ${member.name} (${member.gender})${leaderTag}\n`;
        });
        text += '\n';
      });

      navigator.clipboard.writeText(text.trim()).then(() => showToast('Teks WhatsApp berhasil disalin!'));
    }

    function copyExcel() {
      let text = 'Kelompok\tNama\tGender\tPeran\n';
      currentGroups.forEach((group, index) => {
        group.forEach(member => {
          const role = member.isLeader ? 'Ketua' : 'Anggota';
          text += `Kelompok ${index + 1}\t${member.name}\t${member.gender}\t${role}\n`;
        });
      });

      navigator.clipboard.writeText(text.trim()).then(() => showToast('Format Tabel Excel berhasil disalin!'));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
  </script>
</body>
</html>
